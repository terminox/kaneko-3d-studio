<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Log in · Kaneko Tools</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>" />
    <style>
      :root {
        --bg: #f6f4fb;
        --panel: #ffffff;
        --ink: #1d1830;
        --muted: #6e6886;
        --line: #e6e2f0;
        --accent: #7c4dff;
        --err-bg: #ffe9ec;
        --err: #a1203a;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15131c;
          --panel: #1e1b28;
          --ink: #ece9f5;
          --muted: #a39cba;
          --line: #2f2a3d;
          --accent: #9b78ff;
          --err-bg: #3d1a22;
          --err: #ff8fa3;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Thonburi, "Noto Sans Thai", sans-serif;
      }
      form {
        width: 100%;
        max-width: 360px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 28px;
        border-radius: 14px;
        background: var(--panel);
        border: 1px solid var(--line);
      }
      h1 { margin: 0; font-size: 20px; }
      p { margin: 0; color: var(--muted); font-size: 14px; }
      label { font-size: 13px; font-weight: 600; margin-top: 4px; }
      input {
        font: inherit;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: inherit;
      }
      input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
      button {
        font: inherit;
        font-weight: 600;
        padding: 10px 12px;
        border-radius: 8px;
        border: 0;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      .error { padding: 8px 12px; border-radius: 8px; background: var(--err-bg); color: var(--err); font-size: 14px; }
    </style>
  </head>
  <body>
    <form method="post" action="/auth/login">
      <h1>Kaneko Tools</h1>
      <p>สำหรับทีมงานเท่านั้น · Team only</p>
      <div class="error" id="error" role="alert" hidden>รหัสผ่านไม่ถูกต้อง · Wrong password</div>
      <label for="password">รหัสผ่านทีม · Team password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
      <input id="next" name="next" type="hidden" value="/" />
      <button type="submit">เข้าสู่ระบบ · Log in</button>
    </form>
    <script>
      const params = new URLSearchParams(location.search);
      document.getElementById("error").hidden = !params.has("error");
      document.getElementById("next").value = params.get("next") || "/";
    </script>
  </body>
</html>
